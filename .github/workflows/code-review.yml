name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  policy:
    name: Repository security policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR changes
        run: git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" > pr_changes.diff

      - name: Reject known unsafe patterns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          findings=""

          if grep -nE '^\+.*eval[[:space:]]*\(' pr_changes.diff; then
            findings+="- CRITICAL: dynamic eval detected in the PR diff.\n"
          fi

          if grep -nE '^\+.*SELECT.*\+|^\+.*SELECT.*\$\{' pr_changes.diff; then
            findings+="- CRITICAL: SQL query appears to concatenate untrusted input; use parameters.\n"
          fi

          if [ -n "$findings" ]; then
            printf 'Security findings:\n%b' "$findings"
            gh pr comment "$PR_NUMBER" --body "## Automated security review\n\n${findings}\nThe check failed. Fix the findings before merging."
            exit 1
          fi

          echo "No repository policy violations detected in the PR diff."
