name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  audit:
    name: Agent audit log
    runs-on: ubuntu-latest

    steps:
      - name: Create audit log
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'n/a' }}
        run: |
          mkdir -p audit

          cat <<EOF > audit/agent-audit.jsonl
          {"timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","event":"${EVENT_NAME}","actor":"${ACTOR}","repo":"${REPO}","ref":"${REF}","sha":"${SHA}","pr":"${PR_NUMBER}","action":"agent_review_started","result":"success"}
          EOF

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: agent-audit-log
          path: audit/agent-audit.jsonl
          retention-days: 7

  policy:
    name: Repository security policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR changes
        run: git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" > pr_changes.diff

      - name: Reject known unsafe patterns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          findings=""
          eval_token='eval'
          open_paren='('
          select_token='SELECT'
          plus_token='\+'
          parameter_token='\$\{'

          if grep -nE "^\+.*${eval_token}[[:space:]]*\\${open_paren}" pr_changes.diff; then
            findings+="- CRITICAL: dynamic eval detected in the PR diff.\n"
          fi

          if grep -nE "^\+.*${select_token}.*${plus_token}|^\+.*${select_token}.*${parameter_token}" pr_changes.diff; then
            findings+="- CRITICAL: SQL query appears to concatenate untrusted input; use parameters.\n"
          fi

          if [ -n "$findings" ]; then
            printf 'Security findings:\n%b' "$findings"
            gh pr comment "$PR_NUMBER" --body "## Automated security review\n\n${findings}\nThe check failed. Fix the findings before merging."
            exit 1
          fi

          echo "No repository policy violations detected in the PR diff."
